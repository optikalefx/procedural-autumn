<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Object Gallery — Procedural Autumn</title>
<style>
  /* The game's palette and nothing else from it — same restraint as sound.html.
     This is a utility: the objects are the only thing on this page allowed to
     be interesting to look at. */
  :root {
    color-scheme: dark;
    --bg:#1b1420;
    --panel:#241a2b;
    --panel2:#2c2034;
    --line:rgba(255,246,234,.12);
    --ink:#fff6ea;
    --dim:rgba(255,246,234,.62);
    --faint:rgba(255,246,234,.38);
    --accent:#f3b077;
    --hot:#d1687a;
    --good:#8fd1a0;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size:14px; line-height:1.45;
    display:flex; flex-direction:column;
  }
  h1 { font-size:1.0rem; font-weight:800; letter-spacing:-.01em; }
  h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.18em; color:var(--faint); font-weight:700; }
  h3 { font-size:.66rem; text-transform:uppercase; letter-spacing:.16em; color:var(--accent);
       font-weight:700; margin:12px 0 6px; opacity:.85; }
  button, select, input { font:inherit; color:inherit; }
  code { font-family:var(--mono); font-size:.76rem; }

  /* ── top bar ───────────────────────────────────────────────────────────── */
  header {
    display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header .sub { color:var(--faint); font-size:.78rem; }
  header .spacer { flex:1; }
  #search {
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; width:230px; outline:none;
  }
  #search:focus { border-color:var(--accent); }
  #missBtn {
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:6px 11px; cursor:pointer; color:var(--dim);
  }
  #missBtn.warn { color:var(--accent); border-color:rgba(243,176,119,.4); }
  #missBtn:hover { color:var(--ink); }

  /* ── layout ────────────────────────────────────────────────────────────── */
  main { flex:1; display:flex; min-height:0; }

  aside {
    width:330px; flex:0 0 330px; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0;
  }
  .barwrap { height:2px; background:rgba(255,246,234,.08); flex:0 0 auto; }
  .barwrap.done { opacity:0; transition:opacity .6s .3s; }
  #progress { height:100%; width:0; background:var(--accent); transition:width .12s linear; }

  #list { overflow-y:auto; padding:4px 10px 40px; flex:1; }
  .group { margin-top:6px; }
  .grouphead {
    position:sticky; top:0; z-index:2; width:100%;
    display:flex; align-items:center; gap:8px; cursor:pointer;
    background:var(--panel); border:0; border-bottom:1px solid var(--line);
    padding:9px 4px 7px; text-align:left;
  }
  .gname { font-size:.72rem; text-transform:uppercase; letter-spacing:.18em; font-weight:800; }
  .gcount { color:var(--faint); font-size:.7rem; font-family:var(--mono); }
  .group.collapsed .grid, .group.collapsed .fam { display:none; }
  .fam { margin:12px 0 5px 4px; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card {
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:0; cursor:pointer; overflow:hidden; text-align:left;
    display:flex; flex-direction:column; transition:border-color .12s, transform .12s;
  }
  .card:hover { border-color:rgba(243,176,119,.45); }
  .card.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .thumb {
    width:100%; height:auto; aspect-ratio:224/168; display:block;
    background:rgba(0,0,0,.18); opacity:0; transition:opacity .25s;
  }
  .thumb.ready { opacity:1; }
  .cap { padding:6px 8px 7px; display:flex; flex-direction:column; gap:1px; min-width:0; }
  .cap b { font-size:.79rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cap i { font-style:normal; font-size:.68rem; color:var(--faint);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ── viewer ────────────────────────────────────────────────────────────── */
  section.view { flex:1; position:relative; min-width:0; display:flex; flex-direction:column; }
  #stage { flex:1; width:100%; display:block; touch-action:none; cursor:grab; min-height:0; }
  #stage:active { cursor:grabbing; }

  .plate {
    position:absolute; top:14px; left:16px; pointer-events:none;
    text-shadow:0 1px 10px rgba(0,0,0,.55);
  }
  .plate #subject { font-size:1.35rem; font-weight:800; letter-spacing:-.015em; }
  .plate #subjectSub { font-size:.78rem; color:var(--dim); }
  .plate #subjectFile { font-family:var(--mono); font-size:.68rem; color:var(--faint); margin-top:3px; }

  .info {
    position:absolute; top:14px; right:16px; width:238px;
    background:rgba(27,20,32,.82); backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  #call { display:block; font-family:var(--mono); font-size:.68rem; color:var(--accent);
          word-break:break-word; margin-bottom:8px; opacity:.9; }
  .stat { display:flex; justify-content:space-between; gap:10px; font-size:.76rem; padding:1px 0; }
  .stat .k { color:var(--faint); }
  .stat .v { font-family:var(--mono); }
  .note { font-size:.7rem; color:var(--dim); margin-top:4px; padding-left:9px;
          border-left:2px solid rgba(243,176,119,.35); }
  .wait { color:var(--faint); font-size:.78rem; }
  .bad { color:var(--hot); font-size:.76rem; }

  /* Per-object options. In the flow rather than floated over the canvas: the
     control strip below wraps to two rows on a narrow window, and an absolutely
     positioned bar sitting a fixed distance off the bottom lands on top of it. */
  #opts {
    flex:0 0 auto; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:8px 16px 0;
  }
  #opts:empty { display:none; }
  .opt { display:flex; align-items:center; gap:6px; background:rgba(27,20,32,.82);
         backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:8px;
         padding:4px 8px; font-size:.7rem; color:var(--faint); }
  .opt select { background:transparent; border:0; outline:none; font-size:.74rem; color:var(--ink); }
  .opt select option { background:var(--panel2); }
  .mini { background:rgba(27,20,32,.82); backdrop-filter:blur(8px); border:1px solid var(--line);
          border-radius:8px; padding:5px 10px; font-size:.74rem; cursor:pointer; color:var(--dim); }
  .mini:hover { color:var(--ink); border-color:rgba(243,176,119,.45); }

  /* control strip */
  .controls {
    flex:0 0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:9px 16px; background:var(--panel); border-top:1px solid var(--line);
  }
  .controls .hint { flex:1 1 100%; }
  .controls label { display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--dim); }
  .controls input[type=range] { width:96px; accent-color:var(--accent); }
  .controls input[type=checkbox] { accent-color:var(--accent); }
  .chip { background:var(--panel2); border:1px solid var(--line); border-radius:999px;
          padding:4px 11px; font-size:.72rem; cursor:pointer; color:var(--dim); }
  .chip.on { color:var(--bg); background:var(--accent); border-color:var(--accent); font-weight:700; }
  .hint { color:var(--faint); font-size:.7rem; font-family:var(--mono); }

  /* ── not-shown drawer ──────────────────────────────────────────────────── */
  #miss {
    position:fixed; inset:0; background:rgba(12,8,15,.72); backdrop-filter:blur(3px);
    display:none; z-index:40; padding:6vh 5vw;
  }
  #miss.open { display:block; }
  #missPanel {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    max-width:940px; margin:0 auto; max-height:88vh; overflow:auto; padding:20px 24px 26px;
  }
  #missPanel .top { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  #missClose { margin-left:auto; background:var(--panel2); border:1px solid var(--line);
               border-radius:8px; padding:5px 12px; cursor:pointer; color:var(--dim); }
  .lead { color:var(--dim); font-size:.82rem; max-width:70ch; margin-bottom:6px; }
  .miss { display:flex; flex-direction:column; gap:5px; }
  .missrow { display:grid; grid-template-columns:minmax(240px, 42%) 1fr; gap:14px;
             padding:6px 8px; background:var(--panel2); border-radius:7px; font-size:.76rem; }
  .allclear { color:var(--good); font-size:.82rem; padding:8px 10px; margin:8px 0 2px;
              background:rgba(143,209,160,.08); border:1px solid rgba(143,209,160,.28);
              border-radius:8px; }
  .missrow code { color:var(--accent); }
  .missrow span { color:var(--dim); }

  @media (max-width: 900px) {
    main { flex-direction:column; }
    aside { width:100%; flex:0 0 42%; border-right:0; border-bottom:1px solid var(--line); }
    .info { display:none; }
  }
</style>
</head>
<body>

<header>
  <h1>Object Gallery</h1>
  <span class="sub" id="count">…</span>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="Search objects, families, files…" />
  <button id="missBtn">Not shown <b id="missCount">0</b></button>
</header>

<main>
  <aside>
    <div class="barwrap"><div id="progress"></div></div>
    <div id="list"></div>
  </aside>

  <section class="view">
    <canvas id="stage"></canvas>

    <div class="plate">
      <div id="subject">—</div>
      <div id="subjectSub"></div>
      <div id="subjectFile"></div>
    </div>

    <div class="info">
      <code id="call"></code>
      <div id="stats"></div>
    </div>

    <div id="opts"></div>
    <div class="controls">
      <label><input type="checkbox" id="turn" checked /> Turntable</label>
      <label><input type="checkbox" id="grid" checked /> Ground + metre grid</label>
      <label><input type="checkbox" id="figure" /> 1.70 m figure</label>
      <label><input type="checkbox" id="wire" /> Wireframe</label>
      <label>Sun az <input type="range" id="sunAz" min="-3.15" max="3.15" step="0.01" value="0.9" /></label>
      <label>elev <input type="range" id="sunEl" min="0.03" max="1.5" step="0.01" value="0.62" /></label>
      <label>exp <input type="range" id="exposure" min="0.4" max="2.0" step="0.02" value="1" /></label>
      <span id="backdrops" style="display:flex; gap:6px;"></span>
      <button class="chip" id="reframe">Reframe</button>
      <span class="hint">drag orbit · shift-drag pan · wheel zoom · ←/→ step · R re-roll · space turntable</span>
    </div>
  </section>
</main>

<div id="miss">
  <div id="missPanel">
    <div class="top">
      <h1>Not shown</h1>
      <button id="missClose">Close</button>
    </div>
    <div id="missBody"></div>
  </div>
</div>

<script type="module" src="/src/tools/gallery/main.js"></script>
</body>
</html>
