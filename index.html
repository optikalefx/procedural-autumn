<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Camping Season</title>
<style>
  :root {
    color-scheme: dark;
    --ink:#fff6ea;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1b1420; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position:fixed; inset:0; }
  canvas#gl { display:block; width:100%; height:100%; }

  /* ── Load screen ──────────────────────────────────────────────────────── */
  #loader {
    position:fixed; inset:0; z-index:50; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(140% 110% at 50% 118%, #2b1c33 0%, rgba(43,28,51,0) 55%),
      radial-gradient(120% 90% at 62% 26%, #ffe9c9 0%, #f3b077 34%, #d1687a 66%, #5b3350 88%, #2b1c33 100%);
    transition: opacity 1.1s var(--ease), filter 1.1s var(--ease);
    color:var(--ink);
  }
  #loader.hidden { opacity:0; filter:blur(6px); pointer-events:none; }

  /* Layered ridgelines — the game's own aerial perspective, in CSS. */
  #loader .ridge {
    position:absolute; left:-5%; width:110%; bottom:0;
    background-repeat:repeat-x; background-position:center bottom;
    will-change:transform;
  }
  #loader .r1 { height:46%; opacity:.30; filter:blur(1.5px);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='300' preserveAspectRatio='none'><path d='M0,300 L0,168 L70,132 L150,176 L232,110 L312,158 L400,96 L486,150 L566,118 L654,164 L742,124 L830,170 L916,132 L1000,178 L1086,140 L1200,182 L1200,300 Z' fill='%23a4738f'/></svg>");
    background-size:100% 100%; animation:drift1 46s linear infinite; }
  #loader .r2 { height:34%; opacity:.46; filter:blur(.6px);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='300' preserveAspectRatio='none'><path d='M0,300 L0,196 L96,150 L188,200 L286,142 L382,192 L476,152 L578,204 L668,160 L764,206 L864,164 L962,210 L1064,170 L1200,212 L1200,300 Z' fill='%23784b6e'/></svg>");
    background-size:100% 100%; animation:drift2 62s linear infinite; }
  #loader .r3 { height:24%; opacity:.72;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='300' preserveAspectRatio='none'><path d='M0,300 L0,232 L110,206 L214,244 L322,204 L436,246 L548,212 L660,250 L772,216 L886,252 L998,220 L1200,254 L1200,300 Z' fill='%234a2c4c'/></svg>");
    background-size:100% 100%; }
  @keyframes drift1 { from{transform:translateX(0)} to{transform:translateX(-4%)} }
  @keyframes drift2 { from{transform:translateX(0)} to{transform:translateX(3%)} }

  /* Drifting leaves */
  #leaves { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #leaves i {
    position:absolute; display:block; width:11px; height:8px; top:-6%;
    border-radius:60% 20% 55% 25%;
    animation:fall linear infinite;
    opacity:.75;
  }
  @keyframes fall {
    0%   { transform:translate3d(0,-10vh,0) rotate(0deg); opacity:0; }
    8%   { opacity:.8; }
    92%  { opacity:.65; }
    100% { transform:translate3d(var(--dx), 112vh, 0) rotate(var(--rot)); opacity:0; }
  }

  #loader .stack { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
  #loader h1 {
    font-size: clamp(2.4rem, 7.2vw, 5.2rem); font-weight:800; letter-spacing:-.012em;
    line-height:1.02; text-align:center;
    color:#fffaf2;
    text-shadow: 0 1px 0 rgba(255,226,190,.55), 0 10px 44px rgba(120,52,44,.5);
    animation:rise 1.1s var(--ease) both;
  }
  #loader .sub {
    margin-top:.7em; font-size:clamp(.72rem,1.35vw,.92rem); letter-spacing:.34em;
    text-transform:uppercase; opacity:.82; animation:rise 1.1s .12s var(--ease) both;
  }
  @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }

  #bar {
    margin-top:3.2em; width:min(400px, 58vw); height:3px; border-radius:99px;
    background:rgba(255,255,255,.22); overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 2px 18px rgba(90,40,30,.28);
    animation:rise 1.1s .2s var(--ease) both;
  }
  #bar > i {
    display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#ffcf86,#fff4e2);
    box-shadow:0 0 14px rgba(255,214,150,.85);
    transition:width .5s var(--ease);
  }
  #status {
    margin-top:1.35em; font-size:.74rem; letter-spacing:.2em; text-transform:uppercase;
    opacity:.72; min-height:1.2em; animation:rise 1.1s .28s var(--ease) both;
  }
  #hint {
    position:absolute; bottom:2.4rem; z-index:2; opacity:.5;
    font-size:.7rem; letter-spacing:.2em; text-align:center; padding:0 1.5rem;
    animation:rise 1.1s .4s var(--ease) both;
  }
  #hint b { font-weight:700; opacity:.9; }
  @media (prefers-reduced-motion: reduce) {
    #loader *, #loader { animation:none !important; transition:opacity .3s linear !important; }
  }
</style>
</head>
<body>
  <div id="app"><canvas id="gl"></canvas></div>
  <div id="loader">
    <div class="ridge r1"></div>
    <div class="ridge r2"></div>
    <div class="ridge r3"></div>
    <div id="leaves"></div>
    <div class="stack">
      <h1>Camping&nbsp;Season</h1>
      <div class="sub">A quiet drive through the fall</div>
      <div id="bar"><i></i></div>
      <div id="status">Waking the valley…</div>
    </div>
    <div id="hint"><b>WASD</b> drive &nbsp;·&nbsp; <b>Space</b> handbrake &nbsp;·&nbsp; <b>C</b> camera &nbsp;·&nbsp; <b>F</b> photo mode</div>
  </div>
  <script>
    // A handful of drifting leaves so the load screen is not a dead progress bar.
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const host = document.getElementById('leaves');
      const tints = ['#e8622a', '#f09a2c', '#f3cf45', '#9e2b28', '#b8471f', '#c9a24a'];
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 26; i++) {
        const el = document.createElement('i');
        const dur = 9 + Math.random() * 13;
        el.style.left = (Math.random() * 100).toFixed(2) + '%';
        el.style.background = tints[(Math.random() * tints.length) | 0];
        el.style.animationDuration = dur.toFixed(2) + 's';
        el.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
        el.style.setProperty('--dx', ((Math.random() - 0.35) * 34).toFixed(1) + 'vw');
        el.style.setProperty('--rot', ((Math.random() - 0.5) * 1440).toFixed(0) + 'deg');
        el.style.transform = 'scale(' + (0.6 + Math.random() * 0.9).toFixed(2) + ')';
        frag.appendChild(el);
      }
      host.appendChild(frag);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
